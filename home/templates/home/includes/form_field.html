<div class="billing-info mb-25{% if field.errors %} has-error{% endif %}">
	<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% else %} <span class="optional">(optional)</span>{% endif %}</label>
	{{ field }}
	{% for error in field.errors %}<p class="shoroshi-field-error">{{ error }}</p>{% endfor %}
</div>
